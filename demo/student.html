  <style>
/* ==========================================================
   Cloud Dancer Bento — 강의평가 Studio 디자인 시스템
   ========================================================== */
:root {
  --bg: #F5F3EF;
  --surface: #FFFFFF;
  --surface-2: #FAF9F6;
  --ink: #18181B;
  --muted: #6B6B76;
  --line: #E7E4DE;
  --line-strong: #D6D2CA;
  --control: #8A867E;           /* 입력·칩 경계(WCAG 1.4.11 비텍스트 대비 3:1) */
  --primary: #5B4BFF;
  --primary-ink: #4536E6;       /* 링크·작은 텍스트용(대비 강화) */
  --primary-soft: #ECE9FF;
  --on-primary: #FFFFFF;
  --accent: #FF6B4A;            /* 장식·강조 배지 전용 — 본문 텍스트 금지 */
  --accent-soft: #FFE5DE;
  --butter: #FFE8A3;
  --sky: #DCEBFF;
  --danger: #E5484D;
  --danger-ink: #C62A2F;
  --danger-soft: #FDECEC;
  --focus: #5B4BFF;
  --shadow: 0 1px 2px rgba(24, 24, 27, .04), 0 4px 16px rgba(24, 24, 27, .04);
  --radius: 24px;
  --radius-sm: 14px;
  --radius-pill: 999px;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.2, .7, .2, 1);
  /* 리커트 분포(발산형: 코랄 ↔ 회색 중앙 ↔ 아이리스) — dataviz 검증기로 인접 ΔE(정상≥15, CVD≥8) 확인 */
  --lk1: #B4321A;
  --lk2: #EE7B60;
  --lk3: #C6C2BA;
  --lk4: #9184FF;
  --lk5: #5B4BFF;
  --chart-muted: #8E8B95;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214;
    --surface: #1C1C20;
    --surface-2: #232328;
    --ink: #F2F1EE;
    --muted: #A6A5AE;
    --line: #2E2E34;
    --line-strong: #3C3C44;
    --control: #74737C;
    --primary: #8B80FF;
    --primary-ink: #A79EFF;
    --primary-soft: #2A2650;
    --on-primary: #121214;
    --accent: #FF8466;
    --accent-soft: #3D231C;
    --butter: #4A3F1C;
    --sky: #1D2C42;
    --danger: #FF6B70;
    --danger-ink: #FF8A8E;
    --danger-soft: #3A1D1F;
    --focus: #A79EFF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --lk1: #F2876C;
    --lk2: #B04A36;
    --lk3: #47454C;
    --lk4: #6156C8;
    --lk5: #B0A8FF;
    --chart-muted: #85848D;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1, h2, h3, h4 { font-weight: 700; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.0625rem; }
p { margin: 0; }
a { color: var(--primary-ink); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
.num, .tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .8125rem; }
.center { text-align: center; }
.stack > * + * { margin-top: 12px; }
.stack-lg > * + * { margin-top: 20px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.hidden { display: none !important; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: -48px; z-index: 100;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; text-decoration: none;
}
.skip-link:focus { top: 12px; }

:focus { outline: none; }
/* 화면 낭독기용으로 프로그램이 옮긴 포커스(제목 등 비대화형)에는 테두리를 그리지 않음 */
[tabindex="-1"]:focus { outline: none; }
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 10px;
}

/* ───── 레이아웃 ───── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-bottom: 1px solid var(--line);
}
@supports not (background: color-mix(in srgb, red 50%, blue)) { .topbar { background: var(--bg); } }
.topbar-inner {
  max-width: 1200px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: var(--on-primary);
  display: grid; place-items: center; flex: none;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand small { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); line-height: 1.2; }

.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 16px 32px; flex: 1 0 auto; }
.wrap.narrow { max-width: 640px; }
.wrap.medium { max-width: 880px; }

.footer {
  border-top: 1px solid var(--line);
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  text-align: center; color: var(--muted); font-size: .875rem;
}
.footer .owner { color: var(--ink); font-weight: 600; }
.footer .credit { font-size: .75rem; margin-top: 4px; }
.footer .disclaimer {
  max-width: 640px; margin: 10px auto 0; font-size: .75rem; line-height: 1.5;
}

/* ───── 카드·벤토 ───── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  min-width: 0;
}
.card.pad-lg { padding: 28px; }
.card.soft { background: var(--primary-soft); border-color: transparent; }
.card.butter { background: var(--butter); border-color: transparent; }
.card.sky { background: var(--sky); border-color: transparent; }
.card.interactive { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s; cursor: pointer; }
.card.interactive:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.card-title { display: flex; align-items: center; gap: 8px; font-size: .9375rem; font-weight: 600; color: var(--muted); }
.card-title svg { width: 18px; height: 18px; }

.bento {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 12px;
}
@media (min-width: 640px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .span-2 { grid-column: span 2; }
}
@media (min-width: 1000px) {
  .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span-3 { grid-column: span 3; }
  .span-4 { grid-column: span 4; }
  .row-2 { grid-row: span 2; }
}
@media (min-width: 640px) and (max-width: 999px) {
  .span-3, .span-4 { grid-column: span 2; }
}

.big-num {
  font-size: clamp(48px, 9vw, 64px);
  font-weight: 700; line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.big-num .unit { font-size: .4em; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.mid-num { font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* ───── 배지 ───── */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--radius-pill);
  font-size: .8125rem; font-weight: 600; line-height: 1.4;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  white-space: nowrap;
}
.badge svg { width: 14px; height: 14px; }
.badge.open { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
.badge.ready { background: var(--sky); color: var(--ink); border-color: transparent; }
.badge.closed { background: var(--surface-2); color: var(--muted); }
.badge.hot { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.badge.hot .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.badge.warn { background: var(--butter); color: var(--ink); border-color: transparent; }
.badge.danger { background: var(--danger-soft); color: var(--danger-ink); border-color: transparent; }

/* ───── 버튼 ───── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--control);
  background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; text-decoration: none;
  transition: transform .15s var(--ease), background .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-ink); border-color: var(--primary-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger-ink); border-color: var(--danger-soft); background: var(--danger-soft); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .875rem; }
.btn.icon { width: 44px; min-height: 44px; padding: 0; }
.btn.sm.icon { width: 40px; min-height: 40px; }
.btn.block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn .spinner { width: 18px; height: 18px; }

/* ───── 폼 ───── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font-weight: 600; font-size: .9375rem; }
.field .hint { font-size: .8125rem; color: var(--muted); }
.field .error { font-size: .8125rem; color: var(--danger-ink); font-weight: 600; }
.input, .select, .textarea {
  width: 100%; min-height: 48px; padding: 10px 14px;
  border: 1px solid var(--control); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
}
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); }
.input.code {
  font-size: 1.375rem; letter-spacing: .18em; text-align: center; font-weight: 700;
  font-variant-numeric: tabular-nums; text-transform: uppercase;
}
.form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); }

/* ───── 칩(리커트·선택지) ───── */
.likert {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
  margin: 0; padding: 0; border: 0;
}
.chip {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 64px; min-width: 48px; padding: 8px 4px;
  border: 1px solid var(--control); border-radius: 18px;
  background: var(--surface); color: var(--ink);
  cursor: pointer; text-align: center; line-height: 1.25;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, background .15s, color .15s;
}
.chip .n { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip .l { font-size: .6875rem; color: var(--muted); }
.chip:hover { border-color: var(--primary); }
.chip[aria-checked="true"], .chip[aria-pressed="true"] {
  background: var(--primary); border-color: var(--primary); color: var(--on-primary);
}
.chip[aria-checked="true"] .l, .chip[aria-pressed="true"] .l { color: var(--on-primary); }
.chip.pop { animation: chip-pop .38s var(--spring); }
@keyframes chip-pop { 0% { transform: scale(.97); } 100% { transform: scale(1); } }
.likert-scale { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-top: 6px; }
@media (min-width: 480px) { .chip .l { font-size: .75rem; } }

.option-list { display: grid; gap: 8px; }
.option {
  display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px;
  border: 1px solid var(--control); border-radius: 16px; background: var(--surface);
  cursor: pointer; text-align: left; width: 100%;
  transition: border-color .15s, background .15s;
}
.option .mark {
  width: 22px; height: 22px; flex: none; border: 2px solid var(--control); border-radius: 50%;
  display: grid; place-items: center;
}
.option.multi .mark { border-radius: 6px; }
.option[aria-checked="true"] { border-color: var(--primary); background: var(--primary-soft); }
.option[aria-checked="true"] .mark { border-color: var(--primary); background: var(--primary); }
.option[aria-checked="true"] .mark::after {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--on-primary);
}
.option.multi[aria-checked="true"] .mark::after { width: 10px; height: 6px; border-radius: 0; background: none;
  border-left: 2px solid var(--on-primary); border-bottom: 2px solid var(--on-primary); transform: rotate(-45deg) translate(1px, -1px); }

/* ───── 진행 바 ───── */
.progress {
  height: 8px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden;
}
.progress > span {
  display: block; height: 100%; width: 0; background: var(--primary); border-radius: inherit;
  transition: width .45s var(--ease);
}
.progress.thin { height: 6px; }

/* ───── 설문 ───── */
.survey-head { position: sticky; top: 56px; z-index: 10; background: var(--bg); padding: 8px 0 12px; }
.q-card .q-domain { font-size: .8125rem; font-weight: 600; color: var(--primary-ink); }
.q-card .q-text { font-size: 1.1875rem; font-weight: 700; line-height: 1.45; margin: 6px 0 16px; }
.q-card .req { color: var(--danger-ink); font-weight: 700; margin-left: 4px; }
.q-card + .q-card { margin-top: 12px; }
.q-card.invalid { border-color: var(--danger); }
.q-error { color: var(--danger-ink); font-size: .875rem; font-weight: 600; margin-top: 8px; }
.nav-bar {
  position: sticky; bottom: 0; z-index: 10;
  display: flex; gap: 8px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 75%, transparent);
}
.nav-bar .btn { flex: 1; }
.counter { font-size: .8125rem; color: var(--muted); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kbd {
  display: inline-block; min-width: 22px; padding: 0 6px; border: 1px solid var(--line-strong);
  border-bottom-width: 2px; border-radius: 6px; font-size: .75rem; text-align: center; background: var(--surface);
}

.review-list { list-style: none; margin: 0; padding: 0; }
.review-list li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.review-list li:first-child { border-top: 0; }
.review-list .ans { margin-left: auto; font-weight: 700; text-align: right; flex: none; max-width: 45%; }
.review-list .ans.missing { color: var(--danger-ink); }
.review-list .ans.text { font-weight: 400; color: var(--muted); white-space: pre-wrap; }

.notice-icon {
  width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; margin: 0 auto 16px;
  background: var(--primary-soft); color: var(--primary-ink);
}
.notice-icon svg { width: 34px; height: 34px; }
.notice-icon.warn { background: var(--butter); color: var(--ink); }
.notice-icon.danger { background: var(--danger-soft); color: var(--danger-ink); }

.feature-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.feature-list li { display: flex; gap: 12px; align-items: flex-start; }
.feature-list .ico {
  width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: var(--primary-soft); color: var(--primary-ink);
}
.feature-list .ico svg { width: 18px; height: 18px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px; }

/* ───── 탭 ───── */
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap;
}
.tab svg { width: 16px; height: 16px; }
.tab[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
.tab:hover:not([aria-selected="true"]) { color: var(--ink); background: var(--surface-2); }

/* ───── 표 ───── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: .9375rem; }
table.data th, table.data td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.data th { font-size: .8125rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }

/* ───── 리커트 분포 막대(2px 표면 간격) ───── */
.dist { display: flex; height: 14px; min-width: 120px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
.dist > span { display: block; height: 100%; min-width: 0; }
.dist .d1 { background: var(--lk1); } .dist .d2 { background: var(--lk2); } .dist .d3 { background: var(--lk3); }
.dist .d4 { background: var(--lk4); } .dist .d5 { background: var(--lk5); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8125rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hbar { display: flex; align-items: center; gap: 8px; }
.hbar .track { flex: 1; height: 10px; background: var(--line); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--primary); border-radius: 4px; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--primary); border-radius: 4px; }

.chart-box { position: relative; width: 100%; min-height: 260px; }
.chart-box canvas { max-width: 100%; }

/* ───── 서술형 ───── */
.quote-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }

  CES.uuid = function () {
    if (global.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    (global.crypto || global.msCrypto).getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);

  /* ───── 로딩 상태 ───── */
  var loadingCount = 0, loadingTimer = null;
  CES.loading = function (on) {

    var bar = document.getElementById('loading-bar');
    if (!bar) {
      bar = document.createElement('div');

      bar.setAttribute('aria-label', '불러오는 중');
      document.body.appendChild(bar);
    }
    clearTimeout(loadingTimer);
    if (loadingCount > 0) {
      loadingTimer = setTimeout(function () { bar.classList.remove('hidden'); }, 150);
      document.body.setAttribute('aria-busy', 'true');

  /* ───── 서버 호출 ─────
     모든 google.script.run 호출은 이 함수를 거칩니다(성공·실패 핸들러, 로딩 상태, 선택적 재시도).
     opts.retries: BUSY 응답·네트워크 실패 시 지수 백오프 재시도 횟수(멱등 호출에만 사용)
     opts.onRetry(attempt, max): 재시도 직전 콜백 */
  CES.call = function (fn, args, opts) {
    opts = opts || {};
    var max = opts.retries || 0;
    var silent = !!opts.silent;
    return new Promise(function (resolve) {
      var attempt = 0;
      var run = function () {
        if (!silent) CES.loading(true);
        var done = function (res, isFailure) {
          if (!silent) CES.loading(false);
          var retryable = isFailure || (res && res.code === 'BUSY');
          if (retryable && attempt < max) {
            attempt++;
            if (opts.onRetry) opts.onRetry(attempt, max);
            var delay = Math.min(8000, 800 * Math.pow(2, attempt - 1)) + Math.floor(Math.random() * 400);
            setTimeout(run, delay);
            return;
          }
          resolve(res);
        };
        try {
          var runner = global.google && google.script && google.script.run;
          if (!runner) throw new Error('google.script.run 사용 불가');
          runner
            .withSuccessHandler(function (res) {
              done(res && typeof res === 'object' ? res : { ok: false, code: 'BAD_RESPONSE' }, false);
            })
            .withFailureHandler(function (err) {
              done({ ok: false, code: 'NETWORK', message: String(err && err.message || err) }, true);
            })[fn].apply(null, args || []);
        } catch (e) {
          done({ ok: false, code: 'NETWORK', message: String(e && e.message || e) }, true);
        }
      };
      run();
    });
  };

  CES.errorText = function (res) {
    var map = {
      NETWORK: '네트워크 연결을 확인한 뒤 다시 시도하세요.',
      BUSY: '동시에 많은 요청이 처리되고 있습니다. 잠시 후 다시 시도하세요.',
      SERVER_ERROR: '일시적인 오류가 발생했습니다. 잠시 후 다시 시도하세요.',
      SETUP_REQUIRED: '아직 초기 설정이 되지 않았습니다. 스프레드시트 메뉴에서 초기 설정을 실행하세요.',
      NOT_FOUND: '요청한 교과목을 찾을 수 없습니다.',
      AUTH: '로그인이 만료되었습니다. 다시 로그인하세요.',
      VALIDATION: '입력값을 확인하세요.',
      BAD_RESPONSE: '서버 응답을 해석할 수 없습니다.'
    };
    if (res && res.message && res.code === 'VALIDATION') return res.message;
    return map[res && res.code] || '처리하지 못했습니다. 잠시 후 다시 시도하세요.';

  /* ───── 모달(포커스 트랩, Esc 닫기, 포커스 복귀) ───── */
  CES.modal = function (opts) {
    var prev = document.activeElement;
    var back = document.createElement('div');
    back.className = 'modal-backdrop';
    var id = 'm' + Math.random().toString(36).slice(2, 8);
    back.innerHTML =
      '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + id + '">' +
      '<div class="modal-head"><h2 id="' + id + '">' + CES.esc(opts.title) + '</h2>' +
      '<button type="button" class="btn ghost icon sm" data-close aria-label="닫기">' + CES.icon('x') + '</button></div>' +
      '<div class="modal-body">' + (opts.html || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    document.body.appendChild(back);
    var dialog = back.querySelector('.modal');
    var api = {
      el: dialog,
      close: function () {
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        if (opts.onClose) opts.onClose();
        if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* 무시 */ } }
      }
    };
    var focusables = function () {
      return CES.$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', dialog)
        .filter(function (el) { return el.offsetParent !== null; });
    };
    // persistent 모달은 Esc·바깥 클릭으로 닫히지 않고, 닫기 버튼은 onRequestClose(확인 절차)를 거칩니다.
    var requestClose = function () { if (opts.onRequestClose) opts.onRequestClose(api); else api.close(); };
    var onKey = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); if (opts.persistent) requestClose(); else api.close(); }
      if (e.key === 'Tab') {
        var f = focusables();
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', function (e) {
      if (e.target === back && !opts.persistent) api.close();
      if (e.target.closest('[data-close]')) { if (opts.persistent) requestClose(); else api.close(); }
    });
    CES.icons();
    setTimeout(function () {
      var first = dialog.querySelector('[autofocus]') || focusables()[1] || focusables()[0];
      if (first) first.focus();
    }, 30);
    if (opts.onOpen) opts.onOpen(api);
    return api;
  };

  CES.confirm = function (title, message, okLabel, danger) {
    return new Promise(function (resolve) {
      var answered = false;
      var m = CES.modal({
        title: title,
        html: '<p>' + CES.esc(message).replace(/\n/g, '<br>') + '</p>',
        footer: '<button type="button" class="btn" data-close>취소</button>' +
          '<button type="button" class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok autofocus>' + CES.esc(okLabel || '확인') + '</button>',
        onClose: function () { if (!answered) resolve(false); }
      });
      m.el.querySelector('[data-ok]').addEventListener('click', function () { answered = true; m.close(); resolve(true); });
    });

  /* ───── 다운로드(샌드박스 iframe에서 실패하면 복사 창으로 대체) ───── */
  CES.download = function (filename, content, mime) {
    var isCsv = /\.csv$/i.test(filename);
    var data = (isCsv ? '﻿' : '') + content; // 엑셀 한글 깨짐 방지 BOM
    try {
      var blob = new Blob([data], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      CES.toast(filename + ' 파일을 내려받았습니다.');
    } catch (e) {
      CES.copyDialog(filename, content);
    }
  };

  /** base64로 받은 이진 파일(PDF 등) 내려받기 */
  CES.downloadBase64 = function (filename, b64, mime) {
    try {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      // PDF 형식의 Blob은 브라우저 PDF 뷰어가 가로채 파일 이름이 'download'로 바뀌는 경우가 있어, 이진 파일로 내려받습니다.
      void mime;
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      CES.toast(filename + ' 파일을 내려받았습니다.');
    } catch (e) {
      CES.toast('파일을 내려받지 못했습니다. 브라우저의 다운로드 차단 설정을 확인하세요.', 'error');
    }
  };

        '<textarea class="textarea" style="min-height:300px;font-family:ui-monospace,monospace;font-size:13px" readonly>' + CES.esc(content) + '</textarea>',

  CES.copy = function (text) {
    var ok = function () { CES.toast('클립보드에 복사했습니다.'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;

  /* ───── 축하 효과(가벼운 confetti, 모션 최소화 설정 시 생략) ───── */
  CES.confetti = function () {
    if (CES.reducedMotion()) return;
    var canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var dpr = global.devicePixelRatio || 1;
    var W = canvas.width = global.innerWidth * dpr;
    var H = canvas.height = global.innerHeight * dpr;
    var css = getComputedStyle(document.documentElement);
    var colors = ['--primary', '--accent', '--butter', '--sky', '--primary-soft'].map(function (v) {
      return css.getPropertyValue(v).trim() || '#5B4BFF';
    });
    var parts = [];
    for (var i = 0; i < 90; i++) {
      parts.push({
        x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35,
        vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 12 - 4) * dpr,
        w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        c: colors[i % colors.length]
      });
    }
    var start = performance.now();
    var frame = function (t) {
      var elapsed = t - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += .35 * dpr; p.vx *= .99;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - elapsed / 1800);
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (elapsed < 1800) requestAnimationFrame(frame); else canvas.remove();
    };
    requestAnimationFrame(frame);
  };


  /* ───── 링 게이지(SVG) ─────
     frac 0~1, center: 가운데 큰 글자(HTML), caption: 작은 글자 */
  CES.ring = function (frac, center, caption, opts) {
    opts = opts || {};
    var r = 42, c = 2 * Math.PI * r;
    var f = Math.max(0, Math.min(1, Number(frac) || 0));
    return '<span class="ring' + (opts.small ? ' sm' : '') + '" role="img" aria-label="' + CES.esc(opts.label || '') + '">' +
      '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="' + r + '"/>' +
      '<circle class="ring-fg' + (opts.tone ? ' ' + opts.tone : '') + '" cx="50" cy="50" r="' + r + '" stroke-dasharray="' + c.toFixed(2) +
      '" stroke-dashoffset="' + c.toFixed(2) + '" data-off="' + (c * (1 - f)).toFixed(2) + '"/></svg>' +
      '<span class="ring-label" aria-hidden="true"><strong>' + center + '</strong>' + (caption ? '<span>' + caption + '</span>' : '') + '</span></span>';
  };

  /** 숫자 카운트업 자리표시: <span data-count="3.58" data-dec="2">0</span> */
  CES.count = function (value, dec) {
    if (value == null || isNaN(value)) return '—';
    dec = dec == null ? 2 : dec;
    return '<span data-count="' + value + '" data-dec="' + dec + '">' + (CES.reducedMotion() ? Number(value).toFixed(dec) : (0).toFixed(dec)) + '</span>';
  };

  /** 링·막대·카운트업을 화면에 들어온 뒤 부드럽게 채웁니다(모션 최소화 시 즉시). */
  CES.animateIn = function (root) {
    root = root || document;
    var instant = CES.reducedMotion();
    var apply = function () {
      CES.$$('.ring-fg[data-off]', root).forEach(function (el) { el.style.strokeDashoffset = el.getAttribute('data-off'); });
      CES.$$('[data-w]', root).forEach(function (el) { el.style.width = el.getAttribute('data-w'); });
      CES.$$('[data-grow]', root).forEach(function (el) { el.style.flexGrow = el.getAttribute('data-grow'); });
      CES.$$('[data-count]', root).forEach(function (el) {
        var to = Number(el.getAttribute('data-count')), dec = Number(el.getAttribute('data-dec') || 0);
        if (instant) { el.textContent = to.toFixed(dec); return; }
        var t0 = performance.now(), dur = 900;
        var step = function (t) {
          var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
          el.textContent = (to * e).toFixed(dec);
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    };
    if (instant) apply(); else requestAnimationFrame(function () { requestAnimationFrame(apply); });
  };

  /* ───── 워드 클라우드(아르키메데스 나선 배치, SVG) ─────
     words: [{w, n}] 빈도 내림차순. opts.onSelect(word|null) 클릭 시 호출 */
  CES.wordCloud = function (host, words, opts) {
    opts = opts || {};
    host.innerHTML = '';
    if (!words || !words.length) {
      host.innerHTML = '<p class="small muted">표시할 단어가 없습니다.</p>';
      return;
    }
    var W = Math.max(280, Math.round(host.clientWidth || 600));
    var H = opts.height || Math.round(Math.min(380, Math.max(240, W * 0.55)));
    var small = W < 480;
    var maxN = words[0].n, minN = words[words.length - 1].n;
    var ctx = document.createElement('canvas').getContext('2d');
    var family = getComputedStyle(document.body).fontFamily;
    var placed = [], out = [];
    var overlap = function (a, b) {
      return !(a.x + a.w + 3 < b.x || b.x + b.w + 3 < a.x || a.y + a.h + 2 < b.y || b.y + b.h + 2 < a.y);
    };
    words.slice(0, opts.max || 45).forEach(function (wd, i) {
      var t = maxN === minN ? 1 : (wd.n - minN) / (maxN - minN);
      var size = Math.round((small ? 13 : 15) + Math.sqrt(t) * (small ? 26 : 42));
      ctx.font = '700 ' + size + 'px ' + family;
      var tw = ctx.measureText(wd.w).width, th = size * 1.1;
      for (var a = 0; a < 1600; a++) {
        var ang = a * 0.3, rad = 1.6 * ang;
        var x = W / 2 + rad * Math.cos(ang) * (W / H) - tw / 2;
        var y = H / 2 + rad * Math.sin(ang) - th / 2;
        if (x < 2 || y < 2 || x + tw > W - 2 || y + th > H - 2) continue;
        var box = { x: x, y: y, w: tw, h: th };
        if (!placed.some(function (p) { return overlap(p, box); })) {
          placed.push(box);
          out.push({ wd: wd, x: x + tw / 2, y: y + th * 0.8, size: size, tier: t > 0.6 ? 1 : t > 0.25 ? 2 : 3, i: i });
          break;
        }
      }
    });
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + CES.esc(opts.label || '워드 클라우드') + '">' +
      out.map(function (o) {
        return '<text x="' + o.x.toFixed(1) + '" y="' + o.y.toFixed(1) + '" text-anchor="middle" font-size="' + o.size + '" class="wc-t' + o.tier + '"' +
          ' style="--i:' + o.i + '" tabindex="0" role="button" data-w="' + CES.esc(o.wd.w) + '"' +
          ' aria-label="' + CES.esc(o.wd.w) + ' ' + o.wd.n + '회. 선택하면 이 단어가 들어간 응답만 봅니다"><title>' +
          CES.esc(o.wd.w) + ' · ' + o.wd.n + '회</title>' + CES.esc(o.wd.w) + '</text>';
      }).join('') + '</svg>';
    host.innerHTML = svg;
    var current = null;
    var pick = function (el) {
      var w = el ? el.getAttribute('data-w') : null;
      current = current === w ? null : w;
      host.classList.toggle('filtering', !!current);
      CES.$$('text', host).forEach(function (t) { t.classList.toggle('on', t.getAttribute('data-w') === current); });
      if (opts.onSelect) opts.onSelect(current);
    };
    host.querySelector('svg').addEventListener('click', function (e) {
      var t = e.target.closest('text');
      if (t) pick(t);
    });
    host.querySelector('svg').addEventListener('keydown', function (e) {
      var t = e.target.closest('text');
      if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(t); }

        '<p class="sr-only">익명 설문, ' + c.item_count + '문항, 약 ' + c.est_minutes + '분 소요</p>' +
        (c.end_label ? '<p class="small muted">' + icon('calendar') + ' 마감: <span class="num">' + esc(c.end_label) + '</span></p>' : '') +
        (done && c.access_mode !== 'token' ? '<div class="callout">' + icon('info') + '<p class="small">이 기기에서 이미 제출한 기록이 있습니다. 한 사람은 한 번만 응답해 주세요.</p></div>' : '') +
        '<button type="button" class="btn primary block" data-act="to-auth">' + '시작하기' + icon('arrow-right') + '</button>' +
        '</section>'
      );
    }

    /* ───── 2. 인증 ───── */
    function renderAuth(errorMsg) {
      if (!needsCredential()) { verify(''); return; }
      if (S.autoCred) { var auto = S.autoCred; S.autoCred = ''; verify(auto); return; }
      var isToken = S.course.access_mode === 'token';
      var label = isToken ? '일회용 토큰' : '접속코드';
      var help = isToken ? '교수님께 받은 종이 토큰의 8자리 문자(예: ABCD-EF23)를 입력하세요. 토큰은 한 번만 사용할 수 있습니다.'
        : '수업 시간에 안내받은 접속코드를 입력하세요.';
      render(
        '<form class="card pad-lg stack-lg" id="auth-form" novalidate aria-labelledby="at">' +
        '<div class="notice-icon">' + icon(isToken ? 'ticket' : 'key-round') + '</div>' +
        '<div class="center"><h1 id="at">' + label + ' 입력</h1><p class="muted small" style="margin-top:6px">' + esc(S.course.course_name) + '</p></div>' +
        '<div class="field">' +
        '<label for="cred">' + label + '</label>' +
        '<input id="cred" class="input code" name="cred" autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
        'maxlength="' + (isToken ? 9 : 12) + '" inputmode="text" aria-describedby="cred-hint' + (errorMsg ? ' cred-err' : '') + '"' +
        (errorMsg ? ' aria-invalid="true"' : '') + ' value="' + esc(isToken ? formatToken(S.tokenPrefill) : '') + '">' +
        '<p class="hint" id="cred-hint">' + esc(help) + '</p>' +
        (errorMsg ? '<p class="error" id="cred-err">' + icon('circle-alert') + ' ' + esc(errorMsg) + '</p>' : '') +
        '</div>' +
        '<button type="submit" class="btn primary block" id="auth-btn">확인' + icon('arrow-right') + '</button>' +
        '<button type="button" class="btn ghost block" data-act="to-intro">' + icon('arrow-left') + '처음으로</button>' +
        '</form>',
        '#cred'
      );
      var input = $('#cred');
      if (isToken) {
        input.addEventListener('input', function () {
          var pos = input.value.length;
          input.value = formatToken(input.value);
          if (pos >= input.value.length) input.setSelectionRange(input.value.length, input.value.length);
        });
      }
      $('#auth-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var v = input.value.trim();
        if (!v) { renderAuth(label + '을(를) 입력하세요.'); return; }
        verify(v, $('#auth-btn'));
      });
    }

    function formatToken(v) {
      var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      return s.length > 4 ? s.slice(0, 4) + '-' + s.slice(4) : s;
    }

    function verify(cred, btn, resumeStep) {
      var restore = CES.busyButton(btn, '확인 중…');
      return CES.call('verifyAccess', [S.courseId, cred]).then(function (res) {
        restore();
        if (!res.ok) {
          var msgs = {
            BAD_CODE: '접속코드가 올바르지 않습니다. 다시 확인해 주세요.',
            TOKEN_INVALID: '유효하지 않은 토큰입니다. 8자리 문자를 다시 확인해 주세요.'
          };
          if (res.code === 'TOKEN_USED') { CES.store.remove(DRAFT_KEY); return notice('TOKEN_USED'); }
          if (res.code === 'CLOSED') return notice('CLOSED');
          if (res.code === 'NOT_STARTED') return notice('NOT_STARTED');
          if (msgs[res.code]) { CES.store.remove(DRAFT_KEY); return renderAuth(msgs[res.code]); }
          return notice('ERROR', { retry: true });
        }
        S.cred = cred;
        S.items = res.items || [];
        S.labels = res.likertLabels || S.labels;
        if (resumeStep != null) {
          buildSteps();
          S.step = Math.min(resumeStep, S.steps.length);
          if (S.step >= S.steps.length) renderReview(); else renderSurvey();
          CES.toast('임시 저장된 응답을 불러왔습니다.');
        } else {
          renderConsent();
        }
      });
    }

    function resumeDraft(d) {
      S.answers = d.answers || {};
      S.nonce = d.nonce || '';
      verify(d.cred || '', null, d.step || 0);
    }

    /* ───── 3. 익명성 안내 ───── */
    function renderConsent() {
      var minN = S.course.min_responses || 5;
      var rows = [
        ['user-x', '학번·이름·이메일을 수집하지 않습니다', '로그인 없이 응답하며, 응답자를 식별하는 정보는 저장하지 않습니다.'],
        ['clock', '제출 시각을 따로 저장하지 않습니다', '제출 날짜만 기록되며 IP·기기 정보도 수집하지 않습니다.'],
        ['users', minN + '명 이상 응답한 경우에만 결과가 집계됩니다', '교수님은 통계(평균·분포)와 무작위 순서의 서술형 의견만 볼 수 있습니다.'],
        ['shield-check', '성적과 무관합니다', '공식 강의평가를 대체하지 않는 수업 개선(CQI)용 설문입니다.']
      ];
      render(
        '<section class="card pad-lg stack-lg rise" aria-labelledby="ct2">' +
        '<div><p class="muted small">시작하기 전에</p><h1 id="ct2">익명으로 응답합니다</h1></div>' +
        '<ul class="feature-list">' + rows.map(function (r, i) {
          return '<li class="rise" style="--i:' + (i + 1) + '"><span class="ico">' + icon(r[0]) + '</span><div><strong>' + esc(r[1]) + '</strong><p class="small muted">' + esc(r[2]) + '</p></div></li>';
        }).join('') + '</ul>' +
        '<div class="callout info">' + icon('smartphone') +
        '<p class="small">휴대폰에서는 한 화면에 한 문항씩 나오며, 점수를 고르면 다음 문항으로 자동 이동합니다. 키보드 숫자 <span class="kbd">1</span>~<span class="kbd">5</span>로도 고를 수 있습니다. 응답 중 내용은 이 브라우저 탭에 임시 저장됩니다.</p></div>' +
        '<button type="button" class="btn primary block" data-act="begin">동의하고 시작' + icon('arrow-right') + '</button>' +
        '</section>'
      );
    }

    /* ───── 4. 설문 ───── */
    function isDesktop() {
      return !!(window.matchMedia && window.matchMedia('(min-width: 768px)').matches);
    }

    function buildSteps() {
      S.mode = isDesktop() ? 'desktop' : 'mobile';
      S.steps = [];
      if (S.mode === 'mobile') {
        S.items.forEach(function (it) { S.steps.push([it]); });
      } else {
        S.items.forEach(function (it) {
          var last = S.steps[S.steps.length - 1];
          if (last && last[0].domain === it.domain) last.push(it); else S.steps.push([it]);
        });
      }
    }

    function stepOfItem(itemId) {
      for (var i = 0; i < S.steps.length; i++) {
        if (S.steps[i].some(function (it) { return it.item_id === itemId; })) return i;
      }
      return 0;
    }

    function isAnswered(it) {
      var v = S.answers[it.item_id];
      if (it.type === 'multi') return Array.isArray(v) && v.length > 0;
      if (it.type === 'text') return typeof v === 'string' && v.trim() !== '';
      if (it.type === 'select') return typeof v === 'string' && v !== '';
      return v != null && v !== '';
    }

    function answeredCount() {
      return S.items.filter(isAnswered).length;
    }

    function saveDraft() {
      CES.store.set(DRAFT_KEY, { v: 1, cred: S.cred, answers: S.answers, step: S.step, nonce: S.nonce });
    }

    function questionHtml(it) {
      var qid = 'q-' + it.item_id;
      var req = it.required ? '<span class="req" aria-hidden="true">*</span><span class="sr-only">(필수)</span>' : '<span class="small muted"> (선택)</span>';
      var head = domainTag(it.domain) + '<h2 class="q-text" id="' + qid + '" tabindex="-1">' + esc(it.text) + req + '</h2>';
      var body = '';
      var v = S.answers[it.item_id];
      if (it.type === 'likert5') {
        var focusIdx = v ? Number(v) - 1 : 0;
        body = '<div class="likert" role="radiogroup" aria-labelledby="' + qid + '" aria-required="' + it.required + '" data-kind="likert">' +
          [1, 2, 3, 4, 5].map(function (n, i) {
            var on = Number(v) === n;
            return '<button type="button" class="chip has-emo" role="radio" aria-checked="' + on + '" tabindex="' + (i === focusIdx ? 0 : -1) + '"' +
              ' data-val="' + n + '" aria-label="' + n + '점, ' + esc(S.labels[i]) + '"><span class="emo" aria-hidden="true">' + EMO[i] + '</span><span class="n" aria-hidden="true">' + n + '</span>' +
              '<span class="l" aria-hidden="true">' + SHORT[i] + '</span></button>';
          }).join('') + '</div>' +
          '<div class="likert-scale" aria-hidden="true"><span>' + esc(S.labels[0]) + '</span><span>' + esc(S.labels[4]) + '</span></div>';
      } else if (it.type === 'select') {
        body = '<label class="sr-only" for="s-' + it.item_id + '">' + esc(it.text) + '</label>' +
          '<select class="select lg" id="s-' + it.item_id + '" data-select="' + esc(it.item_id) + '">' +
          '<option value="">' + (it.required ? '선택하세요' : '선택하지 않음') + '</option>' +
          it.options.map(function (o) { return '<option value="' + esc(o) + '"' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
          '</select>' + (it.required ? '' : '<p class="hint small muted" style="margin-top:8px">응답하지 않아도 됩니다. 응답자가 적은 집단은 결과에서 자동으로 숨겨집니다.</p>');
      } else if (it.type === 'single' || it.type === 'multi') {
        var multi = it.type === 'multi';
        var sel = multi ? (Array.isArray(v) ? v : []) : [v];
        body = '<div class="option-list" role="' + (multi ? 'group' : 'radiogroup') + '" aria-labelledby="' + qid + '" data-kind="' + it.type + '">' +
          it.options.map(function (o, i) {
            var on = sel.indexOf(o) >= 0;
            return '<button type="button" class="option' + (multi ? ' multi' : '') + '" role="' + (multi ? 'checkbox' : 'radio') + '"' +
              ' aria-checked="' + on + '" data-opt="' + i + '"><span class="mark" aria-hidden="true"></span><span>' + esc(o) + '</span></button>';
          }).join('') + '</div>' + (multi ? '<p class="hint small muted" style="margin-top:8px">해당하는 것을 모두 고르세요.</p>' : '');
      } else {
        var len = (v || '').length;
        body = '<label class="sr-only" for="t-' + it.item_id + '">' + esc(it.text) + '</label>' +
          '<textarea class="textarea" id="t-' + it.item_id + '" data-text="' + it.item_id + '" maxlength="1000" rows="5"' +
          ' aria-describedby="c-' + it.item_id + '" placeholder="자유롭게 적어 주세요. 이름·학번 등 개인정보는 쓰지 마세요.">' + esc(v || '') + '</textarea>' +
          '<div class="counter" id="c-' + it.item_id + '" aria-live="off"><span class="num">' + len + '</span> / 1,000자</div>';
      }
      return '<section class="card q-card" data-item="' + esc(it.item_id) + '" aria-labelledby="' + qid + '">' + head + body +
        '<p class="q-error hidden" id="e-' + it.item_id + '" role="alert"></p></section>';
    }

    function renderSurvey(focusItemId) {
      var total = S.steps.length;
      var group = S.steps[S.step];
      var pct = Math.round((S.step + 1) / (total + 1) * 100);
      var label = S.mode === 'mobile' ? '문항' : '영역';
      var isLast = S.step === total - 1;
      var prevPct = Math.round(S.step / (total + 1) * 100);
      var cheer = '';
      CHEERS.forEach(function (c) {
        if (!cheer && (S.step + 1) / total >= c[0] && !S.cheered[c[0]] && S.dir > 0) { S.cheered[c[0]] = true; cheer = c[1]; }
      });
      render(
        '<div class="survey-head">' +
        '<div class="row-between small" style="margin-bottom:8px"><span class="muted">' + esc(S.course.course_name) + '</span>' +
        '<span class="num"><strong>' + (S.step + 1) + '</strong> / ' + total + ' ' + label + '</span></div>' +
        '<div class="progress-wrap"><div class="progress" role="progressbar" aria-label="설문 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"' +
        ' aria-valuetext="' + total + '개 ' + label + ' 중 ' + (S.step + 1) + '번째"><span style="width:' + prevPct + '%"></span></div>' +
        '<span class="progress-marker" aria-hidden="true" style="left:' + prevPct + '%">' + (pct >= 80 ? '🏁' : '✏️') + '</span></div>' +
        '</div>' +
        (cheer ? '<p class="cheer" role="status">' + esc(cheer) + '</p>' : '') +
        '<div id="questions" class="' + (S.dir > 0 ? 'slide-in-r' : 'slide-in-l') + '">' + group.map(questionHtml).join('') + '</div>' +
        '<div class="nav-bar">' +
        '<button type="button" class="btn" data-act="prev">' + icon('arrow-left') + (S.step === 0 ? '안내' : '이전') + '</button>' +
        '<button type="button" class="btn primary" data-act="next">' + (isLast ? '검토하기' : '다음') + icon(isLast ? 'list-checks' : 'arrow-right') + '</button>' +
        '</div>' +
        '<p class="tiny muted center">응답 <span class="num">' + answeredCount() + '/' + S.items.length + '</span> · 임시 저장됨</p>',
        focusItemId ? '#q-' + cssEsc(focusItemId) : '.q-text'
      );
      // 진행 바 부드러운 이동
      requestAnimationFrame(function () {
        var bar = $('.progress > span');
        if (bar) bar.style.width = pct + '%';
        var mk = $('.progress-marker');
        if (mk) mk.style.left = pct + '%';
      });
      CES.announce(total + '개 ' + label + ' 중 ' + (S.step + 1) + '번째. ' + group[0].domain);
    }

    function cssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^\w-]/g, '\\$&'); }

    function setLikert(section, val, fromKey) {
      var id = section.getAttribute('data-item');
      var it = itemById(id);
      var wasEmpty = !isAnswered(it);
      S.answers[id] = val;
      $$('.chip', section).forEach(function (b) {
        var on = Number(b.getAttribute('data-val')) === val;
        b.setAttribute('aria-checked', on);
        b.tabIndex = on ? 0 : -1;
        b.classList.remove('pop');
        if (on) { void b.offsetWidth; b.classList.add('pop'); if (fromKey !== 'mouse') b.focus(); }
      });
      clearError(section);
      saveDraft();
      updateCount();
      if (S.mode === 'mobile' && wasEmpty && S.steps[S.step].length === 1) {
        setTimeout(function () {
          if (S.steps[S.step] && S.steps[S.step][0].item_id === id && !S.submitting) next();
        }, 280);
      }
    }

    function itemById(id) {
      return S.items.filter(function (x) { return x.item_id === id; })[0];
    }

    function updateCount() {
      var el = $('.nav-bar + p .num');
      if (el) el.textContent = answeredCount() + '/' + S.items.length;
    }

    function clearError(section) {
      section.classList.remove('invalid');
      var e = $('.q-error', section);
      if (e) { e.classList.add('hidden'); e.textContent = ''; }
    }

    function validateStep() {
      var firstBad = null;
      S.steps[S.step].forEach(function (it) {
        var sec = $('[data-item="' + cssEsc(it.item_id) + '"]', app);
        if (it.required && !isAnswered(it)) {
          sec.classList.add('invalid');
          var e = $('.q-error', sec);
          e.textContent = '이 문항은 필수입니다. 응답을 선택해 주세요.';
          e.classList.remove('hidden');
          if (!firstBad) firstBad = sec;
        }
      });
      if (firstBad) {
        var focusEl = $('[aria-checked="true"], .chip, .option, textarea, select', firstBad) || firstBad;
        firstBad.scrollIntoView({ block: 'center', behavior: CES.reducedMotion() ? 'auto' : 'smooth' });
        focusEl.focus({ preventScroll: true });
        return false;
      }
      return true;
    }

    function next() {
      if (!validateStep()) return;
      S.dir = 1;
      if (S.step < S.steps.length - 1) {
        S.step++;
        saveDraft();
        renderSurvey();
      } else {
        S.step = S.steps.length;
        saveDraft();
        renderReview();
      }
    }

    function prev() {
      if (S.step === 0) { renderConsent(); return; }
      S.dir = -1;
      S.step--;
      saveDraft();
      renderSurvey();
    }

    /* ───── 5. 검토 ───── */
    function answerLabel(it) {
      var v = S.answers[it.item_id];
      if (!isAnswered(it)) return null;
      if (it.type === 'likert5') return v + ' · ' + S.labels[v - 1];
      if (it.type === 'multi') return v.join(', ');
      return String(v);
    }

    function renderReview(errorIds) {
      var missing = S.items.filter(function (it) { return it.required && !isAnswered(it); });
      var groups = [];
      S.items.forEach(function (it) {
        var g = groups[groups.length - 1];
        if (g && g.domain === it.domain) g.items.push(it); else groups.push({ domain: it.domain, items: [it] });
      });
      render(
        '<div class="survey-head">' +
        '<div class="row-between small" style="margin-bottom:8px"><span class="muted">' + esc(S.course.course_name) + '</span><span>제출 전 검토</span></div>' +
        '<div class="progress" role="progressbar" aria-label="설문 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span style="width:100%"></span></div>' +
        '</div>' +
        '<div class="stack">' +
        '<div><h1 id="rv">응답을 확인해 주세요</h1><p class="muted small" style="margin-top:4px">수정하려면 문항 옆의 [수정]을 누르세요.</p></div>' +
        (missing.length ? '<div class="callout" role="alert">' + icon('circle-alert') + '<p class="small"><strong>필수 문항 ' + missing.length + '개</strong>에 응답하지 않았습니다.</p></div>' : '') +
        groups.map(function (g, gi) {
          return '<section class="card rise" style="--i:' + gi + '">' + domainTag(g.domain) + '<ul class="review-list">' +
            g.items.map(function (it) {
              var a = answerLabel(it);
              var miss = it.required && a == null;
              return '<li><div class="grow small">' + esc(it.text) + '</div>' +
                '<div class="ans small' + (miss ? ' missing' : '') + (it.type === 'text' && a ? ' text' : '') + '">' +
                (a == null ? (miss ? '응답 필요' : '—') : esc(a.length > 80 ? a.slice(0, 80) + '…' : a)) + '</div>' +
                '<button type="button" class="btn ghost sm" data-goto="' + esc(it.item_id) + '" aria-label="' + esc(it.text) + ' 수정">수정</button></li>';
            }).join('') + '</ul></section>';
        }).join('') +
        '</div>' +
        '<div class="nav-bar">' +
        '<button type="button" class="btn" data-act="back-to-survey">' + icon('arrow-left') + '이전</button>' +
        '<button type="button" class="btn primary" data-act="submit" id="submit-btn"' + (missing.length ? ' aria-disabled="true"' : '') + '>' +
        icon('send') + '제출하기</button>' +
        '</div>',
        '#rv'
      );
      CES.announce('제출 전 검토 화면입니다.' + (missing.length ? ' 필수 문항 ' + missing.length + '개가 남아 있습니다.' : ''));
    }

    function submit() {
      if (S.submitting) return;
      var missing = S.items.filter(function (it) { return it.required && !isAnswered(it); });
      if (missing.length) {
        S.step = stepOfItem(missing[0].item_id);
        renderSurvey(missing[0].item_id);
        validateStep();
        return;
      }
      if (!S.nonce) { S.nonce = CES.uuid(); saveDraft(); }
      S.submitting = true;
      var btn = $('#submit-btn');
      var restore = CES.busyButton(btn, '제출 중…');
      CES.call('submitResponse', [S.courseId, S.cred, S.answers, S.nonce], {
        retries: 4,
        onRetry: function (n, max) {
          var span = btn && btn.querySelector('span:last-child');
          if (span) span.textContent = '요청이 많아 다시 시도 중… (' + n + '/' + max + ')';
        }
      }).then(function (res) {
        S.submitting = false;
        if (res.ok) {
          CES.store.remove(DRAFT_KEY);
          CES.store.set(DONE_KEY, new Date().toISOString().slice(0, 10), window.localStorage);
          return renderThanks();
        }
        restore();
        if (res.code === 'TOKEN_USED') { CES.store.remove(DRAFT_KEY); return notice('TOKEN_USED'); }
        if (res.code === 'CLOSED') return notice('CLOSED');
        if (res.code === 'MISSING') {
          var id = (res.missing || [])[0];
          S.step = stepOfItem(id);
          renderSurvey(id);
          validateStep();
          return;
        }
        if (res.code === 'BAD_CODE' || res.code === 'TOKEN_INVALID') {
          CES.store.remove(DRAFT_KEY);
          return renderAuth('접속 정보가 유효하지 않습니다. 다시 입력해 주세요.');
        }
        CES.toast(CES.errorText(res) + ' 응답 내용은 임시 저장되어 있습니다.', 'error');
      });
    }

    /* ───── 6. 감사 ───── */
    function renderThanks() {
      render(
        '<section class="card pad-lg center stack-lg rise" aria-labelledby="th">' +
        '<svg class="check-draw" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45"/><path d="M30 52 l14 14 l27 -30"/></svg>' +
        '<div><h1 id="th">응답이 제출되었습니다</h1><p class="muted" style="margin-top:8px">소중한 의견 감사합니다 🙏<br>여러분의 목소리로 다음 수업이 더 좋아집니다.</p></div>' +
        '<div class="stickers" aria-hidden="true"><div class="sticker" style="--i:0"><span class="emo">📚</span>더 나은 수업</div>' +
        '<div class="sticker" style="--i:1"><span class="emo">🩺</span>좋은 간호사</div><div class="sticker" style="--i:2"><span class="emo">💜</span>고마워요</div></div>' +
        '<div class="callout info" style="text-align:left">' + icon('shield-check') + '<p class="small">응답은 익명으로 저장되었습니다. 이제 이 창을 닫으셔도 됩니다.</p></div>' +
        '</section>'
      );
      CES.announce('응답이 제출되었습니다. 감사합니다.');
      setTimeout(CES.confetti, 150);
      setTimeout(CES.confetti, 900);
    }

    /* ───── 이벤트 ───── */
    app.addEventListener('click', function (e) {
      var t = e.target.closest('button');
      if (!t) return;
      var act = t.getAttribute('data-act');
      if (act === 'reload') return start();
      if (act === 'to-auth') return renderAuth();
      if (act === 'to-intro') return renderIntro();
      if (act === 'begin') { buildSteps(); S.step = 0; saveDraft(); return renderSurvey(); }
      if (act === 'next') return next();
      if (act === 'prev') return prev();
      if (act === 'back-to-survey') { S.step = S.steps.length - 1; return renderSurvey(); }
      if (act === 'submit') return submit();
      var go = t.getAttribute('data-goto');
      if (go) { S.step = stepOfItem(go); return renderSurvey(go); }

      var section = t.closest('.q-card');
      if (!section) return;
      if (t.classList.contains('chip')) return setLikert(section, Number(t.getAttribute('data-val')), e.detail === 0 ? 'key' : 'mouse');
      if (t.classList.contains('option')) {
        var it = itemById(section.getAttribute('data-item'));
        var opt = it.options[Number(t.getAttribute('data-opt'))];
        if (it.type === 'single') {
          S.answers[it.item_id] = opt;
          $$('.option', section).forEach(function (b) { b.setAttribute('aria-checked', b === t); });
        } else {
          var cur = Array.isArray(S.answers[it.item_id]) ? S.answers[it.item_id].slice() : [];
          var i = cur.indexOf(opt);
          if (i >= 0) cur.splice(i, 1); else cur.push(opt);
          S.answers[it.item_id] = cur;
          t.setAttribute('aria-checked', i < 0);
        }
        clearError(section);
        saveDraft();
        updateCount();
      }
    });

    app.addEventListener('change', function (e) {
      var sel = e.target.closest('select[data-select]');
      if (!sel) return;
      S.answers[sel.getAttribute('data-select')] = sel.value;
      clearError(sel.closest('.q-card'));
      saveDraft();
      updateCount();
    });

    app.addEventListener('input', function (e) {
      var ta = e.target.closest('textarea[data-text]');
      if (!ta) return;
      var id = ta.getAttribute('data-text');
      S.answers[id] = ta.value.slice(0, 1000);
      var c = $('#c-' + cssEsc(id) + ' .num');
      if (c) c.textContent = ta.value.length.toLocaleString('ko-KR');
      clearError(ta.closest('.q-card'));
      saveDraft();
      updateCount();
    });

    document.addEventListener('keydown', function (e) {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'textarea' || tag === 'input' || tag === 'select') return;
      if (!$('#questions')) return;

      // 리커트 그룹 내 화살표 이동(라디오 그룹 표준 동작)
      var chip = e.target.closest && e.target.closest('.chip');
      if (chip && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
        e.preventDefault();
        var cur = Number(chip.getAttribute('data-val'));
        var nv = /Left|Up/.test(e.key) ? Math.max(1, cur - 1) : Math.min(5, cur + 1);
        setLikert(chip.closest('.q-card'), nv, 'key');
        return;
      }
      // 숫자 1~5: 포커스된 문항, 없으면 현재 화면의 첫 미응답 리커트 문항
      if (/^[1-5]$/.test(e.key)) {
        var section = e.target.closest && e.target.closest('.q-card');
        if (!section || !$('.likert', section)) {
          var cards = $$('#questions .q-card').filter(function (c) { return $('.likert', c); });
          section = cards.filter(function (c) { return !isAnswered(itemById(c.getAttribute('data-item'))); })[0] || cards[0];
        }
        if (section) { e.preventDefault(); setLikert(section, Number(e.key), 'key'); }
      }
    });

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (!$('#questions') || !S.items.length) return;
        var mode = isDesktop() ? 'desktop' : 'mobile';
        if (mode === S.mode) return;
        var anchor = S.steps[S.step][0].item_id;
        buildSteps();
        S.step = stepOfItem(anchor);
        saveDraft();
        renderSurvey();
      }, 200);
    });

    start();
  })();
  </script>
</body>
</html>
