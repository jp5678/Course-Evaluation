              <div class="field"><label for="p-new">새 PIN (숫자 6~12자리)</label><input class="input" id="p-new" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></div>
              <div class="field"><label for="p-new2">새 PIN 확인</label><input class="input" id="p-new2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></div>
              <div><button type="submit" class="btn">${icon('key-round')}PIN 변경</button></div>
              <p class="tiny muted">변경하면 다른 기기의 로그인도 모두 해제됩니다.</p>
            </form></section>
          <section class="card sky span-4" aria-labelledby="s3"><h2 id="s3" style="margin-bottom:12px">웹 앱 주소</h2>
            ${url ? `<div class="stack"><div class="small">교수 관리자 화면(즐겨찾기 권장)</div>
              <div class="linkbox"><code>${esc(url)}?page=admin</code><button type="button" class="btn sm" data-copy-url="${esc(url)}?page=admin">${icon('copy')}복사</button></div>
              <p class="small">학생 응답 링크는 [교과목] 탭의 [링크·QR]에서 교과목별로 확인하세요.</p></div>`
              : `<p class="small">아직 배포되지 않았습니다.</p>`}
            <p class="tiny muted" style="margin-top:12px">버전 ${esc(A.data.version)}</p>
          </section>
        </div>`, true);
      $('#set-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = readForm(e.target);
        const btn = e.target.querySelector('[type="submit"]');
        const restore = CES.busyButton(btn, '저장 중…');
        const res = await api('saveSettings', [data]);
        restore();
        if (!res.ok) {
          if (res.field === 'min_responses') return CES.toast('최소 공개 응답 수는 3~50입니다.', 'error');
          if (res.field === 'professor_name') return CES.toast('교수명을 입력하세요.', 'error');
          if (res.field === 'departments') return CES.toast('학과를 1개 이상 입력하세요.', 'error');
          return fail(res);
        }
        Object.assign(A.data.settings, { professor_name: data.professor_name.trim(), affiliation: data.affiliation.trim(), min_responses: Number(data.min_responses),
          departments: data.departments.split('\n').map((x) => x.trim()).filter(Boolean) });
        $('#footer-owner').textContent = [A.data.settings.professor_name, A.data.settings.affiliation].filter(Boolean).join(' · ');
        CES.toast('설정을 저장했습니다.');
        refresh();
      });
      $('#pin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const cur = $('#p-cur').value, n1 = $('#p-new').value, n2 = $('#p-new2').value;
        if (!/^\d{6,12}$/.test(n1)) return CES.toast('새 PIN은 숫자 6~12자리입니다.', 'error');
        if (n1 !== n2) return CES.toast('새 PIN 확인이 일치하지 않습니다.', 'error');
        const btn = e.target.querySelector('[type="submit"]');
        const restore = CES.busyButton(btn, '변경 중…');
        const res = await api('changePin', [cur, n1]);
        restore();
        if (!res.ok) return res.code === 'WRONG' ? CES.toast('현재 PIN이 올바르지 않습니다.', 'error') : fail(res);
        CES.toast('PIN을 변경했습니다. 다시 로그인하세요.');
        signOut(true);
      });
    }

    /* ───── 전역 클릭 위임 ───── */
    view.addEventListener('click', async (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.dataset.go) return go(t.dataset.go);
      if (t.dataset.results) { A.resultsCourse = t.dataset.results; return go('results'); }
      if (t.dataset.items) { A.itemsCourse = t.dataset.items; return go('items'); }
      if (t.dataset.export) return doExport(t.dataset.export, t);
      if (t.dataset.wc) {
        A.wcKey = t.dataset.wc;
        A.wcWord = null;
        $$('[data-wc]', view).forEach((b) => b.setAttribute('aria-pressed', b.dataset.wc === A.wcKey));
        return drawWordCloud();
      }
      if (t.hasAttribute('data-wc-clear')) { if (A.wc) A.wc.clear(); A.wcWord = null; $('#wc-hits').innerHTML = ''; return; }
      if (t.dataset.copyUrl) return CES.copy(t.dataset.copyUrl);
      const row = t.closest('.item-row');
      if (row && t.dataset.move) return moveItem(Number(row.dataset.idx), Number(row.dataset.idx) + Number(t.dataset.move), `[data-move="${t.dataset.move}"]`);
      if (row && t.hasAttribute('data-del')) {
        const i = Number(row.dataset.idx);
        A.items.splice(i, 1);
        markDirty();
        drawItems();
        CES.toast(`${i + 1}번 문항을 삭제했습니다. [저장]을 눌러 반영하세요.`);
        return;
      }
      const c = t.dataset.id ? courseById(t.dataset.id) : null;
      switch (t.dataset.act) {
        case 'retry-boot': return boot();
        case 'new-course': return openCourseForm(null);
        case 'edit-course': return openCourseForm(c);
        case 'dup-course': return openDuplicate(c);
        case 'del-course': return deleteCourse(c);
        case 'qr': return openQr(c);
        case 'tokens': return openTokens(c);
        case 'add-item':
          A.items.push({ domain: A.items.length ? A.items[A.items.length - 1].domain : DOMAINS[0], text: '', type: 'likert5', required: true, reverse: false, options: [] });
          markDirty();
          drawItems();
          { const el = $(`#txt-${A.items.length - 1}`); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } }
          return;
        case 'clo': return openClo();
        case 'load-template': return loadTemplate();
        case 'save-items': return saveItems(t);
        default: return;
      }
    });

    let wcResize;
    window.addEventListener('resize', () => {
      clearTimeout(wcResize);
      wcResize = setTimeout(() => { if (A.tab === 'results' && $('#wc')) drawWordCloud(); }, 250);
    });

    $('#logout-btn').addEventListener('click', () => signOut(false));
    window.addEventListener('beforeunload', (e) => {
      if (A.itemsDirty) { e.preventDefault(); e.returnValue = ''; }
    });

    if (A.session) boot(); else renderLogin();
  })();
  </script>
</body>
</html>
