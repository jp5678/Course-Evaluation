    <details id="mn-1" open>
      <summary>1. 한눈에 보는 강의평가 Studio</summary>
      <p>교수가 학기 중 자신의 수업에 대한 학생 의견을 <b>익명으로</b> 모으고, 결과를 시각화해 다음 수업 개선(CQI)에 활용하는 도구입니다. 데이터는 교수 본인의 Google 스프레드시트에만 저장됩니다. <b>학교 공식 강의평가를 대체하지 않습니다.</b></p>
      <table>
        <tr><th>교수</th><td>교과목 등록 → 접속 주소·접속코드 안내 → 응답 현황 확인 → 결과 분석·PDF 내보내기</td></tr>
        <tr><th>학생</th><td>공통 주소 열기 → 접속코드 입력 → 익명 안내 확인 → 32~38문항 응답(약 5~6분) → 제출</td></tr>
        <tr><th>평가 영역</th><td>A 강의 설계 · B 교수학습방법 · C 평가 및 과제 · D 학습성과(CLO) · E 학습 환경 · F 디지털·AI 활용 · G 학습 참여(자기평가) · H 종합 · I 온라인 강의(온라인(비대면)·혼합만) · J 실무 적용(전공심화과정만) · 서술형 3문항</td></tr>
      </table>
    </details>

    <details id="mn-2">
      <summary>2. 설치와 배포 (최초 1회)</summary>
      <ol>
        <li>스프레드시트 ▸ <b>확장 프로그램 ▸ Apps Script</b> ▸ Code.gs에 설치 파일 전체를 붙여 넣고 저장합니다.</li>
        <li>함수 <b>setup</b>을 실행하고 권한을 승인합니다(「확인하지 않은 앱」 화면에서 [고급] ▸ [이동]).</li>
        <li>스프레드시트 메뉴 <b>② 관리자 PIN 설정·재설정</b>에서 숫자 6~12자리 PIN을 정합니다.</li>
        <li><b>배포 ▸ 새 배포 ▸ 웹 앱</b>: <b>실행: 나</b>를 먼저 고르고 <b>액세스: 모든 사용자</b>를 고른 뒤 배포합니다.</li>
        <li>웹 앱 URL(…/exec) 끝에 <code>?page=admin</code>을 붙인 주소가 관리자 화면입니다. 즐겨찾기 하세요.</li>
      </ol>
      <p class="callout"><span>「실행: 웹 앱을 액세스하는 사용자」나 「Google 계정이 있는 모든 사용자」로 배포하면 학생에게 로그인을 요구하고 응답을 저장할 수 없습니다. 배포 직후 <b>시크릿 창</b>에서 웹 앱 주소가 열리는지 확인하세요.</span></p>
    </details>

    <details id="mn-3">
      <summary>3. 로그인과 대시보드</summary>
      <ul>
        <li>관리자 주소(<code>…/exec?page=admin</code>)에서 PIN을 입력합니다. 5회 틀리면 10분간 잠깁니다.</li>
        <li>PIN 입력 상자가 안 보이면 <code>?page=admin</code>이 빠진 것입니다. 학생용 접속코드 화면 아래 <b>교수자 로그인</b> 링크를 누르세요.</li>
        <li>「응답 수」는 진행 중인 모든 교과목의 합계이고, 「전체 평균」·「긍정 응답률」은 <b>결과가 열린 교과목만</b>으로 계산합니다. 카드 아래에 기준(예: 결과가 열린 1개 교과목(30명) 기준 · 1개는 잠김)이 표시됩니다.</li>
        <li>대시보드 맨 위 <b>환영 배너</b>에 오늘 날짜와 진행 중 설문·<b>오늘 새 응답</b>·누적 응답·마감 임박 수가 스티커로 표시되고, [교과목·접속 주소]·[결과 보기]로 바로 이동할 수 있습니다. 오늘 응답이 들어온 교과목 카드에는 <b>오늘 +N</b> 표시가 붙습니다.</li>
        <li><b>응답 추이</b>: 진행 중이거나 최근 2주 안에 마감한 교과목의 <b>날짜별 누적 응답</b>을 꺾은선 그래프로 보여 줍니다(수강인원을 넣은 교과목은 응답률도). 기간은 <b>응답 시작일 ~ 오늘(마감했으면 종료일)</b>이고, 60일보다 길면 <b>최근 60일</b>만 보여 줍니다(누적 수는 그 이전 응답부터 이어서 셈). 마감 후 14일이 지나면 그래프에서 빠집니다. 대시보드를 보는 동안 <b>1분마다 자동 갱신</b>되며(다른 탭·가려진 창에서는 멈춤), <b>지금 새로 고침</b>으로 바로 반영할 수 있습니다. 날짜별 개수만 쓰고 응답 내용·시각은 쓰지 않습니다.</li>
        <li><b>목표 도달 축하</b>: 교과목 응답이 결과 공개 기준(기본 5명)에 처음 도달하면(수강인원을 입력한 교과목은 응답률 80%도) 대시보드에서 축하 효과와 알림이 한 번 나타납니다.</li>
        <li>교과목 카드를 누르면 결과 화면으로 이동합니다. 「마감 임박」은 72시간 안에 끝나는 교과목입니다.</li>
      </ul>
    </details>

    <details id="mn-4">
      <summary>4. 교과목 등록 · 설문 중지 · 다시 시작</summary>
      <ul>
        <li><b>+ 새 교과목</b>: 교과목명, 학년도, 학기·학과·학년·수업 방식·교과목 유형, 응답 시작일시 → 응답 종료일시 → 결과공개일, 참여 방식(접속코드/일회용 토큰)을 입력합니다. 접속코드는 교과목마다 달라야 합니다.</li>
        <li><b>결과공개일은 선택입니다.</b> 비워 두면 응답 중에도 바로 결과를 볼 수 있고, 날짜를 정하면 그날 전까지 결과가 잠깁니다(성적 처리 전 열람 방지). 결과공개일은 교수님 열람 기준이며 학생에게는 결과가 공개되지 않습니다.</li>
        <li>응답 종료일시가 시작일시보다 빠르면 입력하는 즉시 빨간 안내가 나오고 저장 버튼이 잠깁니다.</li>
        <li>수업 방식이 대면이면 온라인 문항(I)이, 교과목 유형이 이론이면 실습실 문항이, 실습이면 이론 강의실 문항이 숨겨집니다.</li>
        <li>응답이 1건이라도 들어오면 문항·수업 방식·교과목 유형은 바꿀 수 없습니다.</li>
        <li><b>설문 중지</b>: [편집] ▸ 「지금 수동으로 마감」 체크 ▸ 저장. 응답·문항은 그대로 보관되고 학생에게는 「마감」 화면이 나옵니다.</li>
        <li><b>다시 시작</b>: 다음 학기·다음 해에는 <b>[복제]</b>로 새 학년도·학기와 기간을 입력합니다(새 접속코드, 이전 학기와 자동 비교). 같은 학기 안에서는 [편집]에서 수동 마감을 해제하고 기간을 새로 입력합니다.</li>
        <li><b>새 학기 준비</b>: [교과목] 위쪽의 <b>새 학기 준비</b> ▸ 복제할 학기·새 학년도/학기·응답 기간 선택 ▸ 준비하기. 그 학기 교과목이 문항째 한 번에 복제되고 <b>새 접속코드</b>가 만들어집니다. 「이전 학기 마감」을 체크하면 이전 접속코드로는 응답할 수 없습니다. 학생 접속 주소(공통 주소)는 그대로입니다.</li>
        <li>응답이 없는 교과목만 삭제할 수 있습니다.</li>
        <li>기본 교과목: 디지털리터러시와 AI활용(1학년·대면), AI융합 간호정보학(3학년·혼합), <b>AI융합 간호정보학(전공심화과정)</b>(2026학년도 2학기·4학년·이론+실습·온라인(비대면), CLO는 AI융합 간호정보학과 동일, 「J. 실무 적용」 영역 2문항 추가 → 38문항(결과도 영역별로 따로 분석)).</li>
      </ul>
    </details>

    <details id="mn-5">
      <summary>5. 문항 관리</summary>
      <ul>
        <li>[문항] 탭에서 <b>공통 기본 문항 은행</b> 또는 교과목을 고릅니다. 기본 문항 은행을 고치면 이후 새로 만드는 교과목에 적용됩니다.</li>
        <li>문항마다 영역, 문구, 유형(5점 리커트·단일·복수 선택·드롭다운·서술형), 필수, 역문항, 표시 조건을 정합니다.</li>
        <li><b>영역</b>은 드롭다운에서 고릅니다. 목록에 없는 영역은 맨 아래 <b>「직접 입력…」</b>을 고르고 이름을 입력한 뒤 Enter를 누르면 추가되며, 다른 문항의 목록에도 나타납니다.</li>
        <li><b>CLO 일괄 입력</b>: 학습성과를 한 줄에 하나씩 붙여 넣으면 「나는 ~할 수 있게 되었다.」 문항이 D 영역에 들어갑니다. 새 교과목에는 기본 문항의 <b>일반형 CLO 5개</b>가 복사되므로, 「기존 D 문항 교체」(기본 선택)로 이 교과목의 CLO로 바꾸세요.</li>
        <li><b>G. 학습 참여(자기평가)</b>: 학생이 자신의 수업 준비(플립러닝 사전 학습 등)·수업 참여·과제·시험 준비를 스스로 평가하는 4문항으로, 「종합」 바로 앞에 있습니다. 강의 평가가 아니므로 <b>전체 평균·긍정 응답률·강점/개선점·레이더 차트에서 제외</b>하고, 결과 화면의 <b>「학생 학습 참여」 카드</b>에 따로 보여 줍니다(학습 참여와 전반적 만족도의 상관계수 r, 참여 높음·낮음 집단별 만족도 — 각 집단 최소 공개 수 이상일 때만, 평균 3.5점 미만 문항의 CQI 개선 제안).</li>
        <li><b>플립러닝 운영</b>: 교과목 편집의 체크를 끄면 「플립러닝 사전 학습」 문항이 숨겨집니다(기존·새 교과목은 기본 체크). 응답이 들어온 뒤에는 바꿀 수 없습니다.</li>
        <li>편집기 위쪽에 학생에게 보이는 문항 수와 예상 시간이 표시됩니다(기본: 대면 32문항, 혼합·온라인(비대면) 36문항, 약 5~6분).</li>
      </ul>
    </details>

    <details id="mn-6">
      <summary>6. 학생 참여 안내 (공통 주소 · 접속코드 · 토큰)</summary>
      <table>
        <tr><th>공통 주소 + 접속코드</th><td>[교과목] ▸ <b>접속 주소</b>. <b>안내문 복사(LMS 공지용)</b>로 주소·접속코드 안내문을 LMS에 올리면, 학생은 주소를 열고 접속코드만 입력합니다. 모든 교과목이 같은 주소를 씁니다. 접속코드를 비워 두면 저장할 때 자동으로 만들어집니다.</td></tr>
        <tr><th>주소 복사·안내문</th><td><b>주소 복사</b>와 <b>안내문 복사</b>는 항상 <b>원래 주소</b>(…/exec)를 씁니다. 창의 주소가 Apps Script [배포 ▸ 배포 관리]의 <b>웹 앱 URL과 같은지</b> 먼저 확인하고, 다르면 [설정]에서 고치세요.</td></tr>
        <tr><th>수업 중 안내</th><td><b>수업 화면에 띄우기</b>로 주소와 접속코드를 강의실 화면에 크게 보여 줍니다.</td></tr>
        <tr><th>일회용 토큰</th><td>토큰 방식 교과목의 <b>토큰</b>에서 수강생보다 2~3개 넉넉히 생성 → 인쇄해 <b>무작위로 섞어</b> 배부. 토큰 원문은 생성 화면에서 한 번만 보입니다.</td></tr>
      </table>
    </details>

    <details id="mn-7">
      <summary>7. 학생 응답 화면</summary>
      <ul>
        <li>학생은 로그인 없이 휴대폰으로 응답합니다: (공통 주소면 접속코드 입력) → 교과목 안내 → 익명성 안내 → 문항 → 검토 → 제출.</li>
        <li>화면을 새로 고쳐도 입력한 답이 유지됩니다(탭을 닫으면 임시 저장은 지워짐).</li>
        <li>빠진 필수 문항은 검토 단계에서 안내합니다. 기간 전·후, 사용한 토큰은 안내 화면이 나옵니다.</li>
      </ul>
    </details>

    <details id="mn-8">
      <summary>8. 결과 분석과 내보내기</summary>
      <ul>
        <li>응답이 <b>최소 공개 수(기본 5명)</b> 미만이거나 결과공개일 전이면 결과·내보내기가 잠깁니다.</li>
        <li>한눈에 보기(응답 수·전체 평균·만족도·추천), 영역별 평균·분포(두 카드 모두 영역 기호 알파벳 순, 학습 참여 자기평가는 회색·「*」), 워드 클라우드(위 버튼으로 서술형 문항 선택 — 추가한 문항은 「수강 후기」처럼 문항 앞부분으로 표시), 레이더 차트, 학기 간·분반 간 비교, 문항별 결과, 서술형 응답, CQI 요약(강점은 <b>옅은 초록</b>, 개선점은 <b>노랑</b> 카드, 문항 평균 상위·하위 3개)을 제공합니다.</li>
        <li>해석 기준(5점): 4.5 이상 매우 우수 · 4.0 이상 우수 · 3.5 이상 보통 이상 · 3.0 이상 보통 · 3.0 미만 개선 필요. 긍정 응답률 = 4·5점 비율.</li>
      </ul>
      <table>
        <tr><th>원자료 PDF</th><td>문항 번호표 → 객관식 응답표(무작위 순서) → 서술형 응답표</td></tr>
        <tr><th>결과 보고서 PDF</th><td>[결과 분석] 위쪽 <b>결과 보고서 PDF</b>: 매뉴얼처럼 인쇄용으로 짠 보고서입니다. 「학생 학습 참여(자기평가)」 장(문항별 평균, 만족도와의 상관, CQI 제안)도 들어갑니다. 보고서 정보(교과목·학기·응답 기간·응답 수·담당 교수) → ① 한눈에 보기 → ② 영역별 결과(막대·레이더 차트) → ③ 학기·분반 비교 → ④ 문항별 결과(분포 막대) → ⑤ 서술형 응답(워드 클라우드·자주 나온 단어) → ⑥ CQI 요약(강점 초록·개선점 노랑 상자, AI 요약, 개선 계획 작성란). 글자 검색·복사가 됩니다. (이전의 「CQI 요약표 PDF」 내용은 모두 이 보고서에 들어 있습니다.)</td></tr>
      </table>
      <p><b>서술형 응답 AI 분석</b> (CQI 요약표 아래)</p>
      <ol>
        <li><b>범위</b>를 고릅니다(전체 또는 서술형 문항 하나). 글자 수가 표시되고, 너무 길면 문항별로 나누도록 안내합니다.</li>
        <li><b>AI용으로 복사</b>를 눌러 생성형 AI(ChatGPT·Gemini·Claude 등)에 붙여 넣습니다. 간호교육 CQI 보고 양식에 맞춘 요청 문구가 함께 복사됩니다. 파일이 필요하면 <b>서술형 텍스트(AI 붙여넣기용 TXT)</b>를 받습니다.</li>
        <li>AI 요약을 검토해 <b>AI 요약 붙여넣기</b> 칸에 넣고 <b>서술형 응답 PDF(보고·인쇄용)</b>를 저장합니다. 칸을 비우면 PDF에 작성란이 인쇄됩니다.</li>
      </ol>

      <p class="small muted">AI에 넣기 전에 이름·학번 등 개인 식별 정보가 없는지 확인하세요.</p>
    </details>

    <details id="mn-9">
      <summary>9. 설정 · 메뉴 · 버전 업데이트</summary>
      <ul>
        <li>[설정]: 교수명·소속, 학과 목록, 최소 공개 수(3~50), PIN 변경, 학생용 웹 앱 주소(…/exec).</li>
        <li>스프레드시트 메뉴: ① 초기 설정 실행 · ② 관리자 PIN 설정·재설정 · 웹 앱 주소 확인 · <b>응답 시트 빈 열 정리(학기 시작 전)</b> · [테스트] 샘플 응답 생성/삭제.</li>
        <li><b>업데이트</b>: Code.gs를 새 버전으로 바꿔 저장 → <b>setup</b> 실행 → <b>배포 관리 ▸ ✏️ ▸ 버전: 새 버전 ▸ 배포</b>.</li>
      </ul>
      <p class="callout"><span><b>「새 배포」를 만들지 마세요.</b> 웹 앱 주소가 바뀌어 이미 안내한 공통 주소가 열리지 않습니다.</span></p>
      <p class="small muted">[테스트] 샘플 응답은 결과 화면 연습용입니다. 실제 평가 전에 반드시 「샘플 데이터 모두 삭제」를 실행하세요. 삭제는 <b>샘플 응답만</b> 지우며 교과목·접속코드는 그대로 유지됩니다.</p>
      <p class="small muted"><b>[초기화] 모든 응답 데이터 삭제</b>: 실제 응답까지 모두 지우고 사용된 토큰을 되돌립니다(교과목·문항 유지). <b>[초기화] Items 정리</b>: 공통 기본 문항 은행만 남기고 교과목 문항을 지웁니다(응답이 있으면 실행 안 됨, 문항 없는 교과목은 학생에게 「설문 준비 중」). 두 메뉴 모두 「삭제」를 입력해야 실행되며 되돌릴 수 없습니다.</p>
    </details>

    <details id="mn-10">
      <summary>10. 익명성 보호 원칙</summary>
      <ul>
        <li>학번·이름·이메일·IP·기기 정보를 수집하지 않으며, 학생은 로그인하지 않습니다.</li>
        <li>제출 <b>날짜만</b> 저장하고, 응답 행은 시트의 무작위 위치에 들어갑니다.</li>
        <li>최소 공개 수 미만이면 결과·내보내기·비교가 잠기고, 서술형은 무작위 순서로 보입니다.</li>
        <li>토큰은 해시로만 저장되어 응답과 연결할 수 없습니다.</li>
        <li>한계: 접속코드 방식은 중복 응답을 완전히 막지 못하고, 주소와 접속코드가 퍼지면 수업 밖에서도 응답할 수 있습니다. 1인 1회가 중요하면 토큰을 쓰세요.</li>
      </ul>
    </details>

    <details id="mn-11">
      <summary>11. 자주 묻는 질문과 문제 해결</summary>
      <table>
        <tr><th>「현재 파일을 열 수 없습니다」</th><td>시크릿 창에서 열리면 교수님 브라우저의 다중 계정 문제(학생은 정상). 안 열리면 배포가 <b>실행: 나 / 액세스: 모든 사용자</b>인지, [설정]의 학생용 주소가 배포 주소와 같은지 확인.</td></tr>
        <tr><th>학생에게 로그인 화면</th><td>액세스를 「모든 사용자」로 바꾸고 새 버전으로 배포.</td></tr>
        <tr><th>PIN 입력 상자가 없음</th><td>주소에 <code>?page=admin</code>을 붙이거나 접속코드 화면의 「교수자 로그인」 링크.</td></tr>
        <tr><th>학생 주소가 모두 「현재 파일을 열 수 없습니다」(배포 설정은 정상)</th><td>이 스프레드시트에 연결된 프로젝트의 배포가 로그인 없는 접속에서 막힌 경우입니다. ① 스프레드시트 <b>파일 ▸ 사본 만들기</b> ② 사본의 Apps Script에서 <b>setup</b> 실행(원본 주소가 자동으로 비워짐) ③ <b>새 배포</b>(실행: 나 / 액세스: 모든 사용자) ④ 새 URL 끝에 <code>?page=admin</code>을 붙여 접속(새 주소 자동 저장) ⑤ [접속 주소]의 새 주소를 안내. 교과목·문항·응답·PIN은 사본에 그대로 있습니다.</td></tr>
        <tr><th>교수 화면이 「…googleusercontent.com에서 응답하는 데 시간이 너무 오래 걸립니다」</th><td>앱 오류가 아니라 구글 화면 서버 연결 실패입니다. ① 잠시 후 새로 고침 ② 시크릿 창 ③ 휴대폰 핫스팟(LTE) — LTE에서만 열리면 전산실에 <code>*.script.googleusercontent.com</code> 허용 요청.</td></tr>
        <tr><th>예전에 안내한 링크로 들어온 학생</th><td>「이전 방식의 링크입니다」 안내와 함께 접속코드 입력 화면이 나옵니다. 공통 주소와 접속코드를 다시 안내하세요.</td></tr>
        <tr><th>결과가 열리지 않음</th><td>① 응답 수가 최소 공개 수(기본 5명) 미만(익명성 보호, 응답 중에도 5명이 넘으면 열림) ② 결과공개일 전 — 잠금 화면의 <b>결과공개일 바꾸기</b>에서 날짜를 비우면 바로 공개.</td></tr>
        <tr><th>문항을 고칠 수 없음</th><td>응답이 들어온 교과목은 잠김. [복제]로 새 교과목을 만들어 수정.</td></tr>
        <tr><th>Responses 시트에 빈칸</th><td>정상. 문항마다 열이 따로 있어 다른 교과목의 문항 열은 빈칸입니다. 머리글 색이 교과목별로 다르고, 메모에 [교과목명]이 있습니다.</td></tr>
        <tr><th>Items에 같은 문항 반복</th><td>정상. 기본 문항 은행과 교과목마다 복사본을 둡니다. 지우지 마세요.</td></tr>
        <tr><th>Tokens 시트가 비어 있음</th><td>접속코드 방식만 쓰면 정상. 지우면 관리자 화면이 열리지 않으니 숨기기만 하세요.</td></tr>
        <tr><th>PIN을 잊음 / 잠김</th><td>스프레드시트 메뉴 ② 관리자 PIN 설정·재설정. 잠김은 10분 뒤 해제.</td></tr>
      </table>
    </details>
