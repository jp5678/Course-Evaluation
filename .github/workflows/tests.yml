# 푸시·PR마다 테스트와 정식 설치 파일(dist) 최신 여부를 검사합니다.
name: 테스트

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 서버·설치 파일 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: 테스트 의존성 설치
        working-directory: tests
        run: npm ci
      - name: 서버·동시 제출·QR·대비 테스트
        working-directory: tests
        env:
          TZ: Asia/Seoul
        run: node --test --test-concurrency=1 server.test.js bundle.test.js concurrency.test.js qr.test.js contrast.test.js
      - name: 정식 설치 파일로 서버 테스트 재실행
        working-directory: tests
        env:
          TZ: Asia/Seoul
          CES_BUNDLE: '1'
        run: node --test server.test.js
      - name: 설치 파일이 최신 소스로 빌드되었는지 확인
        run: |
          node tools/build-installer.js
          git diff --exit-code -- dist || {
            echo "::error::dist/ 설치 파일이 소스와 다릅니다. 'node tools/build-installer.js'를 실행해 커밋하세요."; exit 1; }
