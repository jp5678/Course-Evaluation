# 테스트 → 체험판 최신 여부 검사 → (기본 브랜치일 때) GitHub Pages 배포
# Pages 설정이 「GitHub Actions」면 이 워크플로가 배포하고,
# 「Deploy from a branch」면 GitHub이 기본 브랜치를 자동 배포하므로 배포 단계는 건너뜁니다.
name: 테스트 및 Pages 배포

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 테스트·체험판 빌드 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: 테스트 의존성 설치
        working-directory: tests
        run: npm ci
      - name: 서버·동시 제출·QR·대비 테스트
        working-directory: tests
        env:
          TZ: Asia/Seoul
        run: node --test --test-concurrency=1 server.test.js bundle.test.js concurrency.test.js qr.test.js contrast.test.js
      - name: 정식 설치 파일로 서버 테스트 재실행
        working-directory: tests
        env:
          TZ: Asia/Seoul
          CES_BUNDLE: '1'
        run: node --test server.test.js
      - name: 체험판·설치 파일이 최신 소스로 빌드되었는지 확인
        run: |
          node tools/build-demo.js
          node tools/build-installer.js
          git diff --exit-code -- index.html demo .nojekyll dist || {
            echo "::error::빌드 산출물이 소스와 다릅니다. 'node tools/build-demo.js && node tools/build-installer.js'를 실행해 커밋하세요."; exit 1; }

  detect:
    name: Pages 배포 방식 확인
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.pages.outputs.type }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "type=$type" >> "$GITHUB_OUTPUT"
          case "$type" in
            workflow) echo "Pages 설정: GitHub Actions → 이 워크플로가 배포합니다." >> "$GITHUB_STEP_SUMMARY" ;;
            legacy)   echo "Pages 설정: 브랜치 배포 → GitHub이 '${{ github.ref_name }}' 브랜치를 자동 배포합니다." >> "$GITHUB_STEP_SUMMARY" ;;
            *)        echo "Pages가 꺼져 있습니다. Settings → Pages에서 켜세요." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  deploy:
    name: GitHub Pages 배포
    needs: detect
    if: needs.detect.outputs.type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r demo _site/demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
