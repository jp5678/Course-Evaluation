<script>
/* ==========================================================
   강의평가 Studio — 공통 클라이언트 라이브러리 (window.CES)
   ========================================================== */
(function (global) {
  'use strict';
  var CES = {};

  /* ───── DOM·문자열 ───── */
  CES.$ = function (sel, root) { return (root || document).querySelector(sel); };
  CES.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' };
  CES.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"'`]/g, function (c) { return ESC[c]; });
  };

  /** Lucide 아이콘 자리표시자. 렌더링 후 CES.icons()로 SVG 변환. */
  CES.icon = function (name, label) {
    return '<i data-lucide="' + CES.esc(name) + '"' + (label ? ' aria-label="' + CES.esc(label) + '" role="img"' : ' aria-hidden="true"') + '></i>';
  };
  CES.icons = function () {
    try { if (global.lucide && global.lucide.createIcons) global.lucide.createIcons(); } catch (e) { /* 아이콘 없이도 동작 */ }
  };

  CES.fmt = function (n, digits) {
    if (n == null || isNaN(n)) return '—';
    return Number(n).toFixed(digits == null ? 2 : digits);
  };

  CES.uuid = function () {
    if (global.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    (global.crypto || global.msCrypto).getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  };

  CES.reducedMotion = function () {
    return !!(global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches);
  };

  /* ───── 저장소(실패해도 앱은 동작) ───── */
  CES.store = {
    get: function (key, area) {
      try { var v = (area || global.sessionStorage).getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
    },
    set: function (key, val, area) {
      try { (area || global.sessionStorage).setItem(key, JSON.stringify(val)); } catch (e) { /* 무시 */ }
    },
    remove: function (key, area) {
      try { (area || global.sessionStorage).removeItem(key); } catch (e) { /* 무시 */ }
    }
  };

  /* ───── 화면 낭독기 알림 ───── */
  CES.announce = function (msg) {
    var el = document.getElementById('sr-status');
    if (!el) return;
    el.textContent = '';
    setTimeout(function () { el.textContent = msg; }, 60);
  };

  /* ───── 로딩 상태 ───── */
  var loadingCount = 0, loadingTimer = null;
  CES.loading = function (on) {
    loadingCount = Math.max(0, loadingCount + (on ? 1 : -1));
    var bar = document.getElementById('loading-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'loading-bar';
      bar.className = 'loading-bar hidden';
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-label', '불러오는 중');
      document.body.appendChild(bar);
    }
    clearTimeout(loadingTimer);
    if (loadingCount > 0) {
      loadingTimer = setTimeout(function () { bar.classList.remove('hidden'); }, 150);
      document.body.setAttribute('aria-busy', 'true');
    } else {
      bar.classList.add('hidden');
      document.body.removeAttribute('aria-busy');
    }
  };

  /** 버튼에 로딩 상태 표시. 반환 함수를 호출하면 원상 복구. */
  CES.busyButton = function (btn, text) {
    if (!btn) return function () {};
    var html = btn.innerHTML;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' + CES.esc(text || '처리 중…') + '</span>';
    return function () {
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.innerHTML = html;
      CES.icons();
    };
  };

  /* ───── 서버 호출 ─────
     모든 google.script.run 호출은 이 함수를 거칩니다(성공·실패 핸들러, 로딩 상태, 선택적 재시도).
     opts.retries: BUSY 응답·네트워크 실패 시 지수 백오프 재시도 횟수(멱등 호출에만 사용)
     opts.onRetry(attempt, max): 재시도 직전 콜백 */
  CES.call = function (fn, args, opts) {
    opts = opts || {};
    var max = opts.retries || 0;
    var silent = !!opts.silent;
    return new Promise(function (resolve) {
      var attempt = 0;
      var run = function () {
        if (!silent) CES.loading(true);
        var done = function (res, isFailure) {
          if (!silent) CES.loading(false);
          var retryable = isFailure || (res && res.code === 'BUSY');
          if (retryable && attempt < max) {
            attempt++;
            if (opts.onRetry) opts.onRetry(attempt, max);
            var delay = Math.min(8000, 800 * Math.pow(2, attempt - 1)) + Math.floor(Math.random() * 400);
            setTimeout(run, delay);
            return;
          }
          resolve(res);
        };
        try {
          var runner = global.google && google.script && google.script.run;
          if (!runner) throw new Error('google.script.run 사용 불가');
          runner
            .withSuccessHandler(function (res) {
              done(res && typeof res === 'object' ? res : { ok: false, code: 'BAD_RESPONSE' }, false);
            })
            .withFailureHandler(function (err) {
              done({ ok: false, code: 'NETWORK', message: String(err && err.message || err) }, true);
            })[fn].apply(null, args || []);
        } catch (e) {
          done({ ok: false, code: 'NETWORK', message: String(e && e.message || e) }, true);
        }
      };
      run();
    });
  };

  CES.errorText = function (res) {
    var map = {
      NETWORK: '네트워크 연결을 확인한 뒤 다시 시도하세요.',
      BUSY: '동시에 많은 요청이 처리되고 있습니다. 잠시 후 다시 시도하세요.',
      SERVER_ERROR: '일시적인 오류가 발생했습니다. 잠시 후 다시 시도하세요.',
      SETUP_REQUIRED: '아직 초기 설정이 되지 않았습니다. 스프레드시트 메뉴에서 초기 설정을 실행하세요.',
      NOT_FOUND: '요청한 교과목을 찾을 수 없습니다.',
      AUTH: '로그인이 만료되었습니다. 다시 로그인하세요.',
      VALIDATION: '입력값을 확인하세요.',
      BAD_RESPONSE: '서버 응답을 해석할 수 없습니다.'
    };
    if (res && res.message && res.code === 'VALIDATION') return res.message;
    return map[res && res.code] || '처리하지 못했습니다. 잠시 후 다시 시도하세요.';
  };

  /* ───── 토스트 ───── */
  CES.toast = function (msg, type) {
    var host = document.getElementById('toast-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'toast-host';
      host.className = 'toast-host';
      host.setAttribute('role', 'status');
      host.setAttribute('aria-live', 'polite');
      document.body.appendChild(host);
    }
    var t = document.createElement('div');
    t.className = 'toast' + (type === 'error' ? ' error' : '');
    t.textContent = msg;
    host.appendChild(t);
    setTimeout(function () { t.remove(); }, type === 'error' ? 5200 : 3200);
  };

  /* ───── 모달(포커스 트랩, Esc 닫기, 포커스 복귀) ───── */
  CES.modal = function (opts) {
    var prev = document.activeElement;
    var back = document.createElement('div');
    back.className = 'modal-backdrop';
    var id = 'm' + Math.random().toString(36).slice(2, 8);
    back.innerHTML =
      '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + id + '">' +
      '<div class="modal-head"><h2 id="' + id + '">' + CES.esc(opts.title) + '</h2>' +
      '<button type="button" class="btn ghost icon sm" data-close aria-label="닫기">' + CES.icon('x') + '</button></div>' +
      '<div class="modal-body">' + (opts.html || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    document.body.appendChild(back);
    var dialog = back.querySelector('.modal');
    var api = {
      el: dialog,
      close: function () {
        document.removeEventListener('keydown', onKey, true);
        back.remove();
        if (opts.onClose) opts.onClose();
        if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* 무시 */ } }
      }
    };
    var focusables = function () {
      return CES.$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', dialog)
        .filter(function (el) { return el.offsetParent !== null; });
    };
    // persistent 모달은 Esc·바깥 클릭으로 닫히지 않고, 닫기 버튼은 onRequestClose(확인 절차)를 거칩니다.
    var requestClose = function () { if (opts.onRequestClose) opts.onRequestClose(api); else api.close(); };
    var onKey = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); if (opts.persistent) requestClose(); else api.close(); }
      if (e.key === 'Tab') {
        var f = focusables();
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', function (e) {
      if (e.target === back && !opts.persistent) api.close();
      if (e.target.closest('[data-close]')) { if (opts.persistent) requestClose(); else api.close(); }
    });
    CES.icons();
    setTimeout(function () {
      var first = dialog.querySelector('[autofocus]') || focusables()[1] || focusables()[0];
      if (first) first.focus();
    }, 30);
    if (opts.onOpen) opts.onOpen(api);
    return api;
  };

  CES.confirm = function (title, message, okLabel, danger) {
    return new Promise(function (resolve) {
      var answered = false;
      var m = CES.modal({
        title: title,
        html: '<p>' + CES.esc(message).replace(/\n/g, '<br>') + '</p>',
        footer: '<button type="button" class="btn" data-close>취소</button>' +
          '<button type="button" class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok autofocus>' + CES.esc(okLabel || '확인') + '</button>',
        onClose: function () { if (!answered) resolve(false); }
      });
      m.el.querySelector('[data-ok]').addEventListener('click', function () { answered = true; m.close(); resolve(true); });
    });
  };

  /* ───── 다운로드(샌드박스 iframe에서 실패하면 복사 창으로 대체) ───── */
  CES.download = function (filename, content, mime) {
    var isCsv = /\.csv$/i.test(filename);
    var data = (isCsv ? '﻿' : '') + content; // 엑셀 한글 깨짐 방지 BOM
    try {
      var blob = new Blob([data], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      CES.toast(filename + ' 파일을 내려받았습니다.');
    } catch (e) {
      CES.copyDialog(filename, content);
    }
  };

  /** base64로 받은 이진 파일(PDF 등) 내려받기 */
  CES.downloadBase64 = function (filename, b64, mime) {
    try {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      // PDF 형식의 Blob은 브라우저 PDF 뷰어가 가로채 파일 이름이 'download'로 바뀌는 경우가 있어, 이진 파일로 내려받습니다.
      void mime;
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      CES.toast(filename + ' 파일을 내려받았습니다.');
    } catch (e) {
      CES.toast('파일을 내려받지 못했습니다. 브라우저의 다운로드 차단 설정을 확인하세요.', 'error');
    }
  };

  CES.copyDialog = function (title, content) {
    var m = CES.modal({
      title: title,
      wide: true,
      html: '<p class="muted small" style="margin-bottom:8px">내려받기가 차단된 환경입니다. 아래 내용을 복사해 메모장·엑셀에 붙여 넣으세요.</p>' +
        '<textarea class="textarea" style="min-height:300px;font-family:ui-monospace,monospace;font-size:13px" readonly>' + CES.esc(content) + '</textarea>',
      footer: '<button type="button" class="btn primary" data-copy>' + CES.icon('copy') + '복사</button>'
    });
    m.el.querySelector('[data-copy]').addEventListener('click', function () {
      CES.copy(content);
    });
  };

  CES.copy = function (text) {
    var ok = function () { CES.toast('클립보드에 복사했습니다.'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { CES.toast('복사하지 못했습니다. 직접 선택해 복사하세요.', 'error'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
  };

  /* ───── 축하 효과(가벼운 confetti, 모션 최소화 설정 시 생략) ───── */
  CES.confetti = function () {
    if (CES.reducedMotion()) return;
    var canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var dpr = global.devicePixelRatio || 1;
    var W = canvas.width = global.innerWidth * dpr;
    var H = canvas.height = global.innerHeight * dpr;
    var css = getComputedStyle(document.documentElement);
    var colors = ['--primary', '--accent', '--butter', '--sky', '--primary-soft'].map(function (v) {
      return css.getPropertyValue(v).trim() || '#5B4BFF';
    });
    var parts = [];
    for (var i = 0; i < 90; i++) {
      parts.push({
        x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35,
        vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 12 - 4) * dpr,
        w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        c: colors[i % colors.length]
      });
    }
    var start = performance.now();
    var frame = function (t) {
      var elapsed = t - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += .35 * dpr; p.vx *= .99;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - elapsed / 1800);
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (elapsed < 1800) requestAnimationFrame(frame); else canvas.remove();
    };
    requestAnimationFrame(frame);
  };


  /* ───── 링 게이지(SVG) ─────
     frac 0~1, center: 가운데 큰 글자(HTML), caption: 작은 글자 */
  CES.ring = function (frac, center, caption, opts) {
    opts = opts || {};
    var r = 42, c = 2 * Math.PI * r;
    var f = Math.max(0, Math.min(1, Number(frac) || 0));
    return '<span class="ring' + (opts.small ? ' sm' : '') + '" role="img" aria-label="' + CES.esc(opts.label || '') + '">' +
      '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="' + r + '"/>' +
      '<circle class="ring-fg' + (opts.tone ? ' ' + opts.tone : '') + '" cx="50" cy="50" r="' + r + '" stroke-dasharray="' + c.toFixed(2) +
      '" stroke-dashoffset="' + c.toFixed(2) + '" data-off="' + (c * (1 - f)).toFixed(2) + '"/></svg>' +
      '<span class="ring-label" aria-hidden="true"><strong>' + center + '</strong>' + (caption ? '<span>' + caption + '</span>' : '') + '</span></span>';
  };

  /** 숫자 카운트업 자리표시: <span data-count="3.58" data-dec="2">0</span> */
  CES.count = function (value, dec) {
    if (value == null || isNaN(value)) return '—';
    dec = dec == null ? 2 : dec;
    return '<span data-count="' + value + '" data-dec="' + dec + '">' + (CES.reducedMotion() ? Number(value).toFixed(dec) : (0).toFixed(dec)) + '</span>';
  };

  /** 링·막대·카운트업을 화면에 들어온 뒤 부드럽게 채웁니다(모션 최소화 시 즉시). */
  CES.animateIn = function (root) {
    root = root || document;
    var instant = CES.reducedMotion();
    var apply = function () {
      CES.$$('.ring-fg[data-off]', root).forEach(function (el) { el.style.strokeDashoffset = el.getAttribute('data-off'); });
      CES.$$('[data-w]', root).forEach(function (el) { el.style.width = el.getAttribute('data-w'); });
      CES.$$('[data-grow]', root).forEach(function (el) { el.style.flexGrow = el.getAttribute('data-grow'); });
      CES.$$('[data-count]', root).forEach(function (el) {
        var to = Number(el.getAttribute('data-count')), dec = Number(el.getAttribute('data-dec') || 0);
        if (instant) { el.textContent = to.toFixed(dec); return; }
        var t0 = performance.now(), dur = 900;
        var step = function (t) {
          var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
          el.textContent = (to * e).toFixed(dec);
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    };
    if (instant) apply(); else requestAnimationFrame(function () { requestAnimationFrame(apply); });
  };

  /* ───── 워드 클라우드(아르키메데스 나선 배치, SVG) ─────
     words: [{w, n}] 빈도 내림차순. opts.onSelect(word|null) 클릭 시 호출 */
  CES.wordCloud = function (host, words, opts) {
    opts = opts || {};
    host.innerHTML = '';
    if (!words || !words.length) {
      host.innerHTML = '<p class="small muted">표시할 단어가 없습니다.</p>';
      return;
    }
    var W = Math.max(280, Math.round(host.clientWidth || 600));
    var H = opts.height || Math.round(Math.min(380, Math.max(240, W * 0.55)));
    var small = W < 480;
    var maxN = words[0].n, minN = words[words.length - 1].n;
    var ctx = document.createElement('canvas').getContext('2d');
    var family = getComputedStyle(document.body).fontFamily;
    var placed = [], out = [];
    var overlap = function (a, b) {
      return !(a.x + a.w + 3 < b.x || b.x + b.w + 3 < a.x || a.y + a.h + 2 < b.y || b.y + b.h + 2 < a.y);
    };
    words.slice(0, opts.max || 45).forEach(function (wd, i) {
      var t = maxN === minN ? 1 : (wd.n - minN) / (maxN - minN);
      var size = Math.round((small ? 13 : 15) + Math.sqrt(t) * (small ? 26 : 42));
      ctx.font = '700 ' + size + 'px ' + family;
      var tw = ctx.measureText(wd.w).width, th = size * 1.1;
      for (var a = 0; a < 1600; a++) {
        var ang = a * 0.3, rad = 1.6 * ang;
        var x = W / 2 + rad * Math.cos(ang) * (W / H) - tw / 2;
        var y = H / 2 + rad * Math.sin(ang) - th / 2;
        if (x < 2 || y < 2 || x + tw > W - 2 || y + th > H - 2) continue;
        var box = { x: x, y: y, w: tw, h: th };
        if (!placed.some(function (p) { return overlap(p, box); })) {
          placed.push(box);
          out.push({ wd: wd, x: x + tw / 2, y: y + th * 0.8, size: size, tier: t > 0.6 ? 1 : t > 0.25 ? 2 : 3, i: i });
          break;
        }
      }
    });
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + CES.esc(opts.label || '워드 클라우드') + '">' +
      out.map(function (o) {
        return '<text x="' + o.x.toFixed(1) + '" y="' + o.y.toFixed(1) + '" text-anchor="middle" font-size="' + o.size + '" class="wc-t' + o.tier + '"' +
          ' style="--i:' + o.i + '" tabindex="0" role="button" data-w="' + CES.esc(o.wd.w) + '"' +
          ' aria-label="' + CES.esc(o.wd.w) + ' ' + o.wd.n + '회. 선택하면 이 단어가 들어간 응답만 봅니다"><title>' +

    host.innerHTML = svg;
    var current = null;
    var pick = function (el) {

      current = current === w ? null : w;

      CES.$$('text', host).forEach(function (t) { t.classList.toggle('on', t.getAttribute('data-w') === current); });

      clear: function () { current = null; host.classList.remove('filtering'); CES.$$('text', host).forEach(function (t) { t.classList.remove('on'); }); },

        return false;
      }
    };
